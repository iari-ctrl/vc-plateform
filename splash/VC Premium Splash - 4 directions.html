<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VC Premium · Splash page — 4 directions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="brand.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #ECEAE3; font-family: "Plus Jakarta Sans", sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ornaments.jsx"></script>
  <script type="text/babel" src="splash-atlas.jsx"></script>
  <script type="text/babel" src="splash-carnet.jsx"></script>
  <script type="text/babel" src="splash-constellation.jsx"></script>

  <script type="text/babel">
    const { DesignCanvas, DCSection, DCArtboard } = window;

    function App() {
      return (
        <DesignCanvas>
          <DCSection id="splash" title="VC Premium Experience · Portails d'entrée" subtitle="01 et 04 portent l'intro chorégraphiée : quatre cercles dorés naîssent en ikigai, tournent, puis se resserrent sur l'aiguille pour former la boussole — les quatre forces (好得要報) apparaîssent et l'écriture monte en fondu (≈ 3 s), puis la boussole bouge au survol. 02 reste le feuillet à la chandelle.">
            <DCArtboard id="atlas" label="01 · L'Atlas Vivant — intro ikigai → boussole, sur parchemin ouvert" width={1440} height={900}>
              <SplashAtlas />
            </DCArtboard>
            <DCArtboard id="constellation" label="04 · La Constellation — intro ikigai → boussole, ciel nocturne / mémo" width={1440} height={900}>
              <SplashConstellation />
            </DCArtboard>
            <DCArtboard id="carnet" label="02 · Le Carnet — feuillet à la chandelle, questions qui s'écrivent" width={1440} height={900}>
              <SplashCarnet />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
