name: CI

# Garde-fou contenu + qualité. La validation bloque tout contenu cassé
# (ids/slugs en double, relatedLessonIds ou marqueurs [[..]]/{{..}} introuvables,
# schéma JSON invalide) avant le lint et le build.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Valider le contenu (strict)
        # Tolérance zéro sur les avertissements d'intégrité (seeAlso/furtherReading
        # sans cible, …). Les lacunes éditoriales (leçons sans quiz) restent des
        # softWarnings non bloquantes — cf. scripts/validate-content.mjs.
        run: npm run validate:content:strict
      - name: Lint
        run: npm run lint
      - name: Build
        # `npm run build` relance aussi la validation via le hook `prebuild`, puis
        # le prérendu statique des routes publiques via le hook `postbuild`
        # (scripts/prerender.mjs, Puppeteer). Le Chromium est récupéré par `npm ci`
        # (postinstall puppeteer) et lancé en `--no-sandbox`. Si le runner ne peut
        # pas lancer Chromium, le prérendu s'auto-ignore (warning) sans casser le build.
        # `prisma generate` n'exige pas DATABASE_URL ; si le build serveur le
        # réclame un jour, ajouter le secret au job.
        run: npm run build
      - name: Tests unitaires (client)
        run: npm run test --workspace client
      - name: Tests d'intégration (serveur)
        # `npm run build` ci-dessus a déjà lancé `prisma generate` ; le test
        # construit sa propre base SQLite jetable (cf. server/test/global-setup.ts).
        run: npm run test --workspace server

  # Garde-fou anti-drift : prouve que le seed (JSON → DB) et l'export (DB → JSON)
  # sont bien inverses l'un de l'autre. On seed une SQLite jetable depuis
  # data/*.json puis on lance `content:export --dry-run` : si un fichier
  # canonique changerait, le script sort en code 1 et le job échoue.
  drift:
    runs-on: ubuntu-latest
    env:
      # Chemin absolu pour que seed et export visent la même base, quel que soit le cwd.
      DATABASE_URL: file:${{ github.workspace }}/server/prisma/drift.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Seed d'une SQLite jetable (generate + migrate deploy + seed)
        run: npm run db:setup --workspace server
      - name: Vérifier que seed et export sont inverses
        run: npm run content:export -- --dry-run
