name: Deploy frontend to GitHub Pages (manual)

on:
  # GitHub is currently used as a code backup. Publishing stays an explicit,
  # manual action until the local-first product and its content are ready.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_URL: /${{ github.event.repository.name }}/
      VITE_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npm run build
          cp client/dist/index.html client/dist/404.html
          touch client/dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: client/dist
          publish_branch: gh-pages
      - name: Print deployed URL
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "Deployed to $URL"
          echo "### Deployed to [$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"
